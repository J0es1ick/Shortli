name: CI

on:
  push:
    branches: ["main", "master", "dev", "codex/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.14-alpine3.24@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: shortli_test
          POSTGRES_USER: shortli
          POSTGRES_PASSWORD: shortli-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortli -d shortli_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SHORTLI_TEST_DATABASE_URL: postgres://shortli:shortli-test-password@127.0.0.1:5432/shortli_test?sslmode=disable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -race -coverpkg=github.com/J0es1ick/shortli/internal/app/... -coverprofile=integration-cover.out ./internal/app/routes -run='^TestSecurityLifecycleWithPostgres$' -count=1

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      POSTGRES_PASSWORD: ci-postgres-password
      DATABASE_USER: shortli_app
      ANALYTICS_SALT: ci-analytics-salt-at-least-32-characters
      METRICS_TOKEN: ci-metrics-token-at-least-24-chars
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - run: docker compose config --quiet
      - run: docker build -t shortli-backend:local backend
      - run: docker build -t shortli-web:local frontend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: shortli-backend:local
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: shortli-web:local
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
      - run: docker compose up -d --no-build --wait
      - run: curl --fail --retry 10 --retry-delay 2 http://127.0.0.1:43176/api/health/ready
      - run: |
          role_is_privileged="$(docker compose exec -T postgres psql -U shortli -d shortli -tAc "SELECT rolsuper OR rolcreatedb OR rolcreaterole OR rolreplication OR has_schema_privilege('shortli_app', 'public', 'CREATE') FROM pg_roles WHERE rolname = 'shortli_app'")"
          test "$role_is_privileged" = "f"
      - if: always()
        run: docker compose down -v
